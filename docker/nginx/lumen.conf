# Local version of /etc/nginx/conf.d/lumen.conf (Appendix A1).
# Differences from production, needed to run on a laptop only:
#   * upstreams point at the services started with `dotnet run` on the host (host.docker.internal)
#   * plain HTTP on :80 (published as http://<org>.lumen.localhost:8088) instead of TLS on :443
#   * server_name uses *.lumen.localhost (resolves to 127.0.0.1 in browsers/curl without /etc/hosts edits)
#   * proxy_pass has no trailing "/" so the /api, /auth, ... prefix is kept - the services (and the log
#     extract A5: "POST /api/quiz/attempt") expect the full path.
# Everything else (X-Org from the subdomain, the static X-Internal-Key) is kept exactly as found.

upstream api       { server host.docker.internal:5006; }
upstream auth      { server host.docker.internal:5001; }
upstream admin     { server host.docker.internal:5003; }
upstream scim      { server host.docker.internal:5007; }
upstream internal  { server host.docker.internal:5009; }

server {
  listen 80;
  server_name ~^(?<org>[a-z0-9-]+)\.lumen\.localhost$ *.lumen.localhost;

  location /api/       { proxy_pass http://api;       proxy_set_header X-Org $org; }
  location /auth/      { proxy_pass http://auth; }
  location /admin/     { proxy_pass http://admin; }
  location /scim/v2/   { proxy_pass http://scim; }
  location /internal/  { proxy_pass http://internal; proxy_set_header X-Internal-Key "k7f1-static-2019"; }
  location /           { root /var/www/webapp; try_files $uri /index.html; }
}
